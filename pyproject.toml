[project]
name = "risktool"
version = "0.1.0"
description = "Builds the REC risk assessment PDF from the Google Sheet"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "gspread>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
risktool = "risktool.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
